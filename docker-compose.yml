services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csms}
      POSTGRES_USER: ${POSTGRES_USER:-csms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
    ports:
      # Mặc định chỉ mở cho máy này (127.0.0.1). Muốn máy khác trong mạng truy cập: đặt BIND_HOST=0.0.0.0 trong .env.
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csms_test
      POSTGRES_USER: csms
      POSTGRES_PASSWORD: csms_test_only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csms -d csms_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    # Đặt tên image tường minh: nếu để trống, docker-compose v1 tự đặt <tên-thư-mục>_app. Thư mục clone mặc định
    # tên 'Charging-Station-Management-System-CSMS-' kết thúc bằng '-' → tag '...csms-_app' không hợp lệ (invalid reference format).
    image: csms_app:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?đặt JWT_SECRET (>=32 ký tự) trong .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-csms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csms}
      OCPP_HEARTBEAT_INTERVAL: ${OCPP_HEARTBEAT_INTERVAL:-60}
      OCPP_PING_INTERVAL: ${OCPP_PING_INTERVAL:-30}
      OCPP_RATE_LIMIT_MAX: ${OCPP_RATE_LIMIT_MAX:-50}
      OCPP_ERROR_DEDUP_SECONDS: ${OCPP_ERROR_DEDUP_SECONDS:-60}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Chạy lint + toàn bộ test trong container (không cần cài Node trên máy): python test.py
  # node_modules nằm trong volume riêng nên không lẫn với node_modules của Windows/macOS trên máy.
  tests:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    working_dir: /app/backend
    environment:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@db_test:5432/csms_test
      CSMS_SKIP_DOTENV: "1"
    volumes:
      - .:/app
      - tests_node_modules:/app/backend/node_modules
    depends_on:
      db_test:
        condition: service_healthy
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run lint && npm test"]

volumes:
  postgres_data:
  tests_node_modules:
