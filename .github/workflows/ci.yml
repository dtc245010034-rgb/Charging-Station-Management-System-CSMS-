# Kiểm tra tự động cho mọi PR vào main và mọi lần merge vào main.
# Chỉ KIỂM TRA (lint + test + quét phụ thuộc). Triển khai staging do Render đảm nhiệm và chỉ chạy khi job này xanh (render.yaml).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push thêm commit vào cùng một PR thì huỷ lần chạy cũ, đỡ chờ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Giống db_test trong docker-compose.yml: cổng 5433, database kết thúc bằng _test.
      db_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_test
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Kiểm logic thuần của run.py/test.py (không cần Docker)
      - run: python3 -m unittest discover -s tools -q
        working-directory: .

  # Windows: nhóm dev trên Windows, còn CI/Docker chạy Linux nên lỗi riêng Windows (dấu '\' trong đường dẫn,
  # CRLF...) lọt qua. Job này chỉ chạy test backend; lint/audit đã có ở job Linux.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Windows runner không chạy được container Postgres: dùng bản PostgreSQL cài sẵn trên máy runner,
      # tạo cụm dữ liệu riêng ở cổng 5433 (auth trust, chỉ tồn tại trong job này).
      - name: Khởi động PostgreSQL
        shell: pwsh
        working-directory: .
        run: |
          $bin = if ($env:PGBIN) { $env:PGBIN } else { (Get-ChildItem "$env:ProgramFiles\PostgreSQL" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin" }
          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          & "$bin\initdb.exe" -D $data -U csms --auth=trust -E UTF8
          & "$bin\pg_ctl.exe" -D $data -o "-p 5433" -l (Join-Path $env:RUNNER_TEMP "pg.log") -w start
          & "$bin\createdb.exe" -h localhost -p 5433 -U csms csms_test

      - run: npm ci
      - run: npm test
