# Kiểm tra tự động cho mọi PR vào main và mọi lần merge vào main.
# Chỉ KIỂM TRA (lint + test + quét phụ thuộc). Triển khai staging do Render đảm nhiệm và chỉ chạy khi job này xanh (render.yaml).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push thêm commit vào cùng một PR thì huỷ lần chạy cũ, đỡ chờ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Giống db_test trong docker-compose.yml: cổng 5433, database kết thúc bằng _test.
      db_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_test
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Verify virtual charge point reconnect energy
        env:
          ADMIN_EMAIL: s21-ci-admin@example.invalid
          ADMIN_PASSWORD: CI-Only-Admin-Password-123!
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          STAGING_BASE_URL: http://127.0.0.1:3000
          STAGING_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          APP_ORIGIN: http://127.0.0.1:3000
          DEMO_PASSWORD: CI-Demo-Password-123!
          ALLOW_DEMO_SEED: '1'
          CSMS_SKIP_DOTENV: '1'
        run: |
          npm run migrate
          node scripts/create-admin.js
          node scripts/seed-demo.js
          PORT=3000 NODE_ENV=test OCPP_HEARTBEAT_INTERVAL=5 node src/server.js > /tmp/csms-s21.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/csms-s21.log; exit 1; fi
            sleep 1
          done
          npm run test:s21-reconnect -- --count 2 --disconnects 1 --runs 1 --prefix S21-CI-
      # Kiểm logic thuần của run.py/test.py (không cần Docker)
      - run: python3 -m unittest discover -s tools -q
        working-directory: .

  # Windows: nhóm dev trên Windows, còn CI/Docker chạy Linux nên lỗi riêng Windows (dấu '\' trong đường dẫn,
  # CRLF...) lọt qua. Job này chỉ chạy test backend; lint/audit đã có ở job Linux.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Windows runner không chạy được container Postgres: dùng bản PostgreSQL cài sẵn trên máy runner,
      # tạo cụm dữ liệu riêng ở cổng 5433 (auth trust, chỉ tồn tại trong job này).
      - name: Khởi động PostgreSQL
        shell: pwsh
        working-directory: .
        run: |
          $bin = if ($env:PGBIN) { $env:PGBIN } else { (Get-ChildItem "$env:ProgramFiles\PostgreSQL" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin" }
          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          & "$bin\initdb.exe" -D $data -U csms --auth=trust -E UTF8
          & "$bin\pg_ctl.exe" -D $data -o "-p 5433" -l (Join-Path $env:RUNNER_TEMP "pg.log") -w start
          & "$bin\createdb.exe" -h localhost -p 5433 -U csms csms_test

      - run: npm ci
      - run: npm test
