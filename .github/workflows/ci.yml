# Kiểm tra tự động cho mọi PR vào main và mọi lần merge vào main.
# Chỉ KIỂM TRA (lint + test + quét phụ thuộc). Triển khai staging do Render đảm nhiệm và chỉ chạy khi job này xanh (render.yaml).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Push thêm commit vào cùng một PR thì huỷ lần chạy cũ, đỡ chờ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Giống db_test trong docker-compose.yml: cổng 5433, database kết thúc bằng _test.
      db_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_test
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Kiểm logic thuần của run.py/test.py (không cần Docker)
      - run: python3 -m unittest discover -s tools -q
        working-directory: .
      # C3: mọi tên tệp test được nhắc trong docs/dev/TONG-KET-DU-AN.md phải tồn tại, số thẻ khớp số dòng bảng
      - run: node tools/check-docs.js
        working-directory: .

  # Windows: nhóm dev trên Windows, còn CI/Docker chạy Linux nên lỗi riêng Windows (dấu '\' trong đường dẫn,
  # CRLF...) lọt qua. Job này chỉ chạy test backend; lint/audit đã có ở job Linux.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Windows runner không chạy được container Postgres: dùng bản PostgreSQL cài sẵn trên máy runner,
      # tạo cụm dữ liệu riêng ở cổng 5433 (auth trust, chỉ tồn tại trong job này).
      - name: Khởi động PostgreSQL
        shell: pwsh
        working-directory: .
        run: |
          $bin = if ($env:PGBIN) { $env:PGBIN } else { (Get-ChildItem "$env:ProgramFiles\PostgreSQL" | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin" }
          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          & "$bin\initdb.exe" -D $data -U csms --auth=trust -E UTF8
          & "$bin\pg_ctl.exe" -D $data -o "-p 5433" -l (Join-Path $env:RUNNER_TEMP "pg.log") -w start
          & "$bin\createdb.exe" -h localhost -p 5433 -U csms csms_test

      - run: npm ci
      - run: npm test

  # S-26 / T-56: Kịch bản kiểm thử phiên sạc đội trụ ảo có ngắt-nối mạng
  # Chặn mọi PR phá hỏng cơ chế khôi phục phiên sạc hoặc tính sai kWh (dưới 5 phút)
  session-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-test

    services:
      db_test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_test
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: .

    env:
      PORT: 3000
      NODE_ENV: test
      JWT_SECRET: "ci-scenario-jwt-secret-at-least-32-chars-long"
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test
      STAGING_BASE_URL: http://localhost:3000
      STAGING_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test
      ADMIN_EMAIL: admin@csms.local
      ADMIN_PASSWORD: AdminCiTestPassword2026!
      OCPP_RATE_LIMIT_BURST: 500
      OCPP_RATE_LIMIT_MAX: 50

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Chạy migration và tạo admin cùng thẻ mẫu
        run: |
          node backend/src/db/migrate.js up
          node backend/scripts/create-admin.js
          node -e "
            const { pool } = require('./backend/src/db/pool');
            pool.query(\"INSERT INTO id_tags (tag, status) VALUES ('TAG-DEMO-01', 'ACTIVE') ON CONFLICT ((UPPER(tag))) DO NOTHING\")
              .then(() => pool.end());
          "

      - name: Khởi động máy chủ và chạy kịch bản khôi phục phiên sạc (5 trụ)
        run: |
          node backend/src/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health | grep -q 'ok'; then
              echo 'CSMS server is ready'
              break
            fi
            sleep 1
          done

          node tools/test-s21-reconnect-fleet.js --count 5 --drops 1-2 --runs 1 --seed 42 --prefix S26-CI-


  # C2: chuỗi demo trên DB sạch: migrate -> seed (2 lần, chứng minh idempotent) -> server -> demo-smoke (6/6).
  # Chặn mọi thay đổi làm seed hoặc tài liệu demo lệch khỏi hệ thống đang chạy.
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    services:
      db_demo:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_demo
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_demo_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      PORT: 3000
      NODE_ENV: test
      JWT_SECRET: "ci-demo-smoke-jwt-secret-at-least-32-chars-long"
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://csms:csms_demo_only@localhost:5434/csms_demo
      ALLOW_DEMO_SEED: "1"
      DEMO_PASSWORD: "CiDemoSmokePass-2026"
      APP_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run migrate

      - name: Seed demo lần 1 và lần 2 (lần 2 không được tạo thêm gì)
        run: |
          set -o pipefail
          npm run seed-demo
          npm run seed-demo | tee seed-second.log
          grep -q "0 tài khoản mới, 0 trạm mới, 0 trụ mới" seed-second.log
          grep -q "0 biểu giá, 0 khung công suất, 0 lần nạp ví, 0 gói thuê bao, 0 tỷ lệ chia sẻ doanh thu" seed-second.log

      - name: Khởi động máy chủ và chạy demo-smoke (kỳ vọng 6/6)
        run: |
          set -o pipefail
          node src/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health | grep -q 'ok'; then
              echo 'CSMS server is ready'
              break
            fi
            sleep 1
          done

          node ../tools/demo-smoke.js | tee smoke.log
          grep -q "6/6 NHÓM ĐẠT" smoke.log
