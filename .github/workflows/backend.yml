name: Backend verification

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms_test
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms_test_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test
      DATABASE_URL: postgresql://csms:csms_test_only@localhost:5433/csms_test
      APP_ORIGIN: http://localhost:3000
      JWT_SECRET: github-actions-test-secret-012345678901234567890123
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test
