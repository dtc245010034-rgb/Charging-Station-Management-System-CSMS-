<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSMS | Quản trị viên</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-role="ADMIN" hidden>
    <div class="page-shell">
      <div class="dashboard-layout" style="display: flex;">
        <header class="dashboard-header">
          <div class="brand-header">
            <div class="brand-mark">CS</div>
            <div>
              <p class="eyebrow">Charging Station Management System</p>
              <h2>Quản trị viên</h2>
            </div>
          </div>
          <div class="user-profile-menu">
            <span class="user-badge" id="userBadge">ADMIN</span>
            <span class="user-email" id="userEmail"></span>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển đổi giao diện sáng/tối">
              <span class="theme-icon">☀️</span>
              <span class="theme-label">Sáng</span>
            </button>
            <button class="logout-btn" id="logoutBtn" type="button">Đăng xuất</button>
          </div>
        </header>
        <main class="dashboard-content">
          <div class="dashboard-banner">
            <h3>Chào mừng, <span id="userName"></span>!</h3>
            <p>Bạn đã đăng nhập với vai trò Quản trị viên.</p>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
